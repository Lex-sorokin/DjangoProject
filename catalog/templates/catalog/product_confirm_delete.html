{% extends 'catalog/base.html' %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-4">
            <div class="row">
                <form class="row" method="post" enctype="multipart/form-data">
                    <div class="card">
                        <p class="card-text">Вы действительно хотите удалить {{ object.name }}?</p>
                        <div class="card-body">
                            {% csrf_token %}
                        </div>
                        <button type="submit" class="btn btn-primary my-2">Удалить</button>
                        <a class="btn btn-primary" href="{% url 'catalog:product_list' %} my-2"
                           role="button">Отменить удаление
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
